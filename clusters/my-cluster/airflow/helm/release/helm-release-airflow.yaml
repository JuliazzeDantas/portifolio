# helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: airflow
  namespace: airflow
spec:
  chart:
    spec:
      chart: airflow
      version: "2.7.1"
      sourceRef:
        kind: HelmRepository
        name: apache-airflow
        namespace: flux-system
  interval: 5m
  valuesFrom:
    - kind: ConfigMap
      name: airflow-values
      valuesKey: values.yaml
  