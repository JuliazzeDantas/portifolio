alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: 'msteams-alerts'
      group_by: ['alertname', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 30m
      routes:
        - receiver: 'null'
          matchers:
            - alertname = "Watchdog"
    receivers:
      - name: 'null'
      - name: 'msteams-alerts'
        msteamsv2_configs:
          - webhook_url: ''
            send_resolved: true
            title: '[OCI] {{ .CommonLabels.severity }}: {{ .CommonLabels.alertname }}'
            text: |-
              **Alerta:** {{ .CommonLabels.alertname }}
              **Severidade:** {{ .CommonLabels.severity }}
              **Descrição:** {{ .CommonAnnotations.description }}
              **Sumário:** {{ .CommonAnnotations.summary }}